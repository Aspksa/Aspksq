name: TRACKTOR Windows launcher

on:
  push:
    branches: [main]
    paths:
      - 'Aspksa.bat'
      - 'Start-Tracktor.ps1'
      - 'server.py'
      - 'cloudru.py'
      - 'skillrunner.py'
      - 'skills.js'
      - 'assistant.js'
      - 'chatrunner.py'
      - 'knowledge.py'
      - 'knowledge.js'
      - 'tests/test_knowledge.py'
      - 'tests/test_chat.py'
      - 'tests/test_chat_graph.py'
      - 'tests/test_internals.py'
      - 'cloud.js'
      - 'tests/test_local_db.py'
      - 'tests/test_cloudru.py'
      - 'tests/test_cloudru_transport.py'
      - 'tests/test_skill_runs.py'
      - 'tests/windows-launcher.ps1'
      - 'tests/windows-portable.ps1'
      - '.github/workflows/windows-launcher.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test Windows file locks and SQLite
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Test genuine Python installer and actual BAT with special characters
        shell: powershell
        env:
          TRACKTOR_TEST_INSTALL_PYTHON: '1'
        run: .\tests\windows-launcher.ps1
      - name: Test Desktop, Documents and portable FAT32/exFAT virtual drives
        shell: powershell
        run: .\tests\windows-portable.ps1
