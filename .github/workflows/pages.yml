name: TRACKTOR local app checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript and Russian UI
        run: |
          node --check app.js
          node --check database.js
          node tests/smoke.mjs
      - name: Test local SQLite server and persistence
        run: python -m unittest discover -s tests -p 'test_*.py' -v
