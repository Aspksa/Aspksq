name: TRACKTOR · Проверка интерфейса

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "styles.css"
      - "app.js"
      - "database.js"
      - "server.py"
      - "cloudru.py"
      - "skillrunner.py"
      - "skills.js"
      - "assistant.js"
      - "chatrunner.py"
      - "knowledge.py"
      - "knowledge.js"
      - "tests/knowledge-ui.cjs"
      - "tests/trace-ui.cjs"
      - "tests/assistant-ui.cjs"
      - "cloud.js"
      - "sqlite-schema.sql"
      - "seed-data.json"
      - "tests/visual.cjs"
      - "tests/cloud-ui.cjs"
      - "tests/cloud_ui_server.py"
      - ".github/workflows/visual-qa.yml"

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Установить Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Проверить интерфейс на 390 / 740 / 1024 / 1440 px
        run: |
          node tests/visual.cjs
          node tests/cloud-ui.cjs
          node tests/assistant-ui.cjs
          node tests/knowledge-ui.cjs
          node tests/trace-ui.cjs
      - name: Сохранить снимки экрана
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tracktor-visual-screenshots
          path: artifacts/screenshots
          if-no-files-found: ignore
          retention-days: 14

